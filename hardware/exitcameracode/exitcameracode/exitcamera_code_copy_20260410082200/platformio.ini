; Exit Gate ESP32-CAM (AI Thinker)
; Board: AI Thinker ESP32-CAM
; Requires FTDI programmer — GPIO0 to GND while powering on to enter flash mode
; Remove GPIO0-GND jumper after upload, then press reset

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
src_dir = .

board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
